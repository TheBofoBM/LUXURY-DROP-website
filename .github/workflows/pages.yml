name: Publicar Luxury Drop en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm ci
      - name: Preparar cliente de cuentas
        run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_GOOGLE_ENABLED: ${{ vars.SUPABASE_GOOGLE_ENABLED }}
      - name: Verificar código y archivos estáticos
        run: npm run check
      - name: Probar promociones e inventario
        run: npm test

  deploy:
    name: Publicar sitio
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Instalar herramientas de publicación
        run: npm ci
      - name: Construir sitio estático
        run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_GOOGLE_ENABLED: ${{ vars.SUPABASE_GOOGLE_ENABLED }}
      - name: Preparar archivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
